version: '3.8'

services:

  # DATABASE POSTGRESQL
  postgres:
    image: postgres:18-alpine
    container_name: coffeeshop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: coffeeshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # CACHING REDIS
  redis:
    image: redis:8-alpine
    container_name: coffeeshop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# PERSISTENT VOLUMES
volumes:
  postgres_data:
  redis_data: